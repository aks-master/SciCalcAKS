---
- name: Deploy SciCalcAKS Application
  hosts: localhost
  become: yes
  tasks:
    - name: Update package cache
      apt:
        update_cache: yes
      when: ansible_os_family == "Debian"

    - name: Remove conflicting packages
      apt:
        name: containerd
        state: absent
      ignore_errors: yes

    - name: Install required dependencies
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - software-properties-common
        state: present

    - name: Add Docker’s official GPG key
      shell: curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo apt-key add -

    - name: Add Docker APT repository
      shell: |
        add-apt-repository "deb [arch=amd64] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable"
      args:
        warn: false

    - name: Update APT cache after adding Docker repo
      apt:
        update_cache: yes

    - name: Install Docker
      apt:
        name: docker-ce
        state: present

    - name: Ensure Docker service is running
      service:
        name: docker
        state: started
        enabled: yes

    - name: Pull latest Docker image
      command: docker pull aks00798/sci-calc-aks:latest

    - name: Stop and remove existing container if running
      command: docker rm -f sci-calc-aks
      ignore_errors: yes

    - name: Run the application container in interactive mode
      command: docker run --rm -it --name sci-calc-aks aks00798/sci-calc-aks
